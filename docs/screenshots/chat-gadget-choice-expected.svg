<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><title>Praxis chat gadget expected screenshot</title><rect width="960" height="620" fill="#f4f5f8"/><rect x="36" y="28" width="888" height="564" rx="16" fill="#fff" stroke="#dfe2e8"/><text x="72" y="76" font-family="Arial" font-size="15" font-weight="700">AI session · GADGET-001</text><text x="72" y="112" font-family="Arial" font-size="14">Provider response remains unchanged.</text><rect x="72" y="142" width="816" height="274" rx="12" fill="#fff" stroke="#c8ccd4"/><text x="92" y="171" font-family="Arial" font-size="11" font-weight="700" fill="#5b45d6">PRAXIS GADGET · PROOF OF CONCEPT</text><text x="92" y="205" font-family="Arial" font-size="18" font-weight="700">What should happen next?</text><text x="92" y="229" font-family="Arial" font-size="13" fill="#68707d">This decision belongs to Praxis, not the AI provider.</text><rect x="92" y="250" width="776" height="46" rx="8" fill="#fff" stroke="#dfe2e8"/><text x="134" y="279" font-family="Arial" font-size="14">◯ Keep local</text><rect x="92" y="304" width="776" height="54" rx="8" fill="#f0edff" stroke="#5b45d6"/><text x="134" y="333" font-family="Arial" font-size="14" font-weight="700">◉ Handoff</text><text x="134" y="350" font-family="Arial" font-size="11" fill="#68707d">Prepare this work for another AI provider.</text><rect x="92" y="366" width="776" height="46" rx="8" fill="#fff" stroke="#dfe2e8"/><text x="134" y="395" font-family="Arial" font-size="14">◯ Cancel</text><rect x="72" y="444" width="130" height="38" rx="8" fill="#f4f5f8" stroke="#c8ccd4"/><text x="98" y="468" font-family="Arial" font-size="13">Try gadget</text><rect x="216" y="444" width="112" height="38" rx="8" fill="#5b45d6"/><text x="242" y="468" font-family="Arial" font-size="13" fill="#fff">Continue</text></svg>