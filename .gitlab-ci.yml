stages:
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org/'

secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# --- Typecheck + unit tests + desktop compile ----------------------------
test:
  stage: test
  image: node:20-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci || npm install
    - npm run build:core
    - npm run check-types
    # `npm test` also runs the desktop e2e suite, which needs an Electron
    # display this image does not have. Run the parts that can.
    - npm run test:core
    - npm run build:renderer
    - npm run desktop:copy-renderer
    - npm run build:desktop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
