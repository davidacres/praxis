[workspace]
resolver = "2"
members = [
  "crates/praxis-contracts",
  "crates/praxis-core",
  "crates/praxis-trackers",
  "crates/praxis-workflows",
  "crates/praxis-ai",
  "crates/praxis-mobile",
  "crates/praxis-host",
  "apps/praxis-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
# Internal workspace crates
praxis-contracts = { path = "crates/praxis-contracts" }
praxis-core = { path = "crates/praxis-core" }
praxis-trackers = { path = "crates/praxis-trackers" }
praxis-workflows = { path = "crates/praxis-workflows" }
praxis-ai = { path = "crates/praxis-ai" }
praxis-mobile = { path = "crates/praxis-mobile" }

# Serialization & TypeScript contract generation
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
jsonc-parser = { version = "0.26", features = ["serde"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde"] }
specta-typescript = "=0.0.9"

# Async runtime, HTTP, WebSockets & errors
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart", "gzip"] }
eventsource-stream = "0.2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["ws", "macros"] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2.0"

# Markdown, file watching, PTY, archives & crypto
pulldown-cmark = { version = "0.13", default-features = false }
notify = { version = "8.0", features = ["macos_fsevent"] }
portable-pty = "0.9"
tar = "0.4"
flate2 = "1.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
libc = "0.2"
nix = { version = "0.28", default-features = false, features = ["signal"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = "0.10"
hmac = "0.12"
zeroize = "1.8"
getrandom = "0.2"
semver = { version = "1.0", features = ["serde"] }
regex = "1.13"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
url = "2.5"

# Node / Electron N-API bridge
napi = { version = "2.16", default-features = false, features = ["napi9", "async", "serde-json"] }
napi-derive = "2.16"
napi-build = "2.1"
