name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build jobs run npm ci and third-party build scripts, so they get a read-only
# token. Only the release job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Build renderer
        run: npm run build:renderer

      - name: Copy renderer
        run: npm run desktop:copy-renderer

      - name: Build desktop
        run: npm run build:desktop

      - name: Build DMG installer
        run: npm run dist:mac --workspace=@praxis/desktop-main

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: |
            apps/praxis-desktop/main/dist/Praxis-*-arm64.dmg
            apps/praxis-desktop/main/dist/Praxis-*-arm64.dmg.blockmap
          if-no-files-found: error
          retention-days: 1

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Build renderer
        run: npm run build:renderer

      - name: Copy renderer
        run: npm run desktop:copy-renderer

      - name: Build desktop
        run: npm run build:desktop

      - name: Build Windows installer
        run: npm run dist:win --workspace=@praxis/desktop-main

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: |
            apps/praxis-desktop/main/dist/Praxis-*-setup.exe
            apps/praxis-desktop/main/dist/Praxis-*-setup.exe.blockmap
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Upload installers to Release
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/Praxis-*-arm64.dmg \
            dist/Praxis-*-arm64.dmg.blockmap \
            dist/Praxis-*-setup.exe \
            dist/Praxis-*-setup.exe.blockmap
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
