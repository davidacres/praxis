name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release (for example v0.4.0)
        required: true
        type: string

# Build jobs run npm ci and third-party build scripts, so they get a read-only
# token. Only the release job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build DMG installer
        run: npm run dist:mac --workspace=@praxis/desktop-main

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: |
            apps/praxis-desktop/main/dist/Praxis-*-arm64.dmg
            apps/praxis-desktop/main/dist/Praxis-*-arm64.dmg.blockmap
            apps/praxis-desktop/main/dist/Praxis-*-arm64.zip
            apps/praxis-desktop/main/dist/Praxis-*-arm64.zip.blockmap
            apps/praxis-desktop/main/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npm run dist:win --workspace=@praxis/desktop-main

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: |
            apps/praxis-desktop/main/dist/Praxis-*-setup.exe
            apps/praxis-desktop/main/dist/Praxis-*-setup.exe.blockmap
            apps/praxis-desktop/main/dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Linux installer
        run: npm run dist:linux --workspace=@praxis/desktop-main

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            apps/praxis-desktop/main/dist/Praxis-*.AppImage
            apps/praxis-desktop/main/dist/Praxis-*.deb
            apps/praxis-desktop/main/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Create Release if needed
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Release $RELEASE_TAG" \
              --generate-notes
          fi
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers and update metadata
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            dist/Praxis-*-arm64.dmg \
            dist/Praxis-*-arm64.dmg.blockmap \
            dist/Praxis-*-arm64.zip \
            dist/Praxis-*-arm64.zip.blockmap \
            dist/Praxis-*-setup.exe \
            dist/Praxis-*-setup.exe.blockmap \
            dist/Praxis-*.AppImage \
            dist/Praxis-*.deb \
            dist/latest.yml \
            dist/latest-mac.yml \
            dist/latest-linux.yml
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
