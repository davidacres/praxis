name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Prefer a reproducible clean install, but fall back to `npm install` when the lockfile
          # is out of sync (this is a temporary CI unblock). Commit a regenerated package-lock.json
          # to the branch as the permanent fix.
          npm ci || npm install --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        if: github.ref == 'refs/heads/main'

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: ticket-manager-vsix
          path: "*.vsix"
