name: Build

on:
  push:
    branches: [main]
  # Also verify stacked PRs targeting a feature branch, such as PR #3.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan the tree
        run: scripts/check-secrets.sh --tree

      - name: Scan the commits in this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-secrets.sh --range "origin/${{ github.base_ref }}..HEAD"
          else
            scripts/check-secrets.sh --range "${{ github.event.before }}..${{ github.sha }}"
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Build mobile protocol declarations
        run: npm run build:mobile-protocol

      - name: Typecheck
        run: npm run check-types

      - name: Build renderer
        run: npm run build:renderer

      - name: Copy renderer into the Electron host
        run: npm run desktop:copy-renderer

      - name: Compile desktop
        run: npm run build:desktop

      - name: Core unit tests
        run: npm run test:core

      - name: Repo skill mirrors match .agents/skills
        run: npm run test:skills

      - name: Desktop Git and persistence tests
        run: npm run test:desktop:git

      - name: Workflow process and write-back tests
        run: npm run test:desktop:workflows

  desktop:
    name: Desktop (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: functional-1
            args: --project=functional --shard=1/4
          - suite: functional-2
            args: --project=functional --shard=2/4
          - suite: functional-3
            args: --project=functional --shard=3/4
          - suite: functional-4
            args: --project=functional --shard=4/4
          - suite: appearance
            args: --project=themes --project=theme-regressions
    # Committed Playwright baselines are Darwin snapshots. Do not regenerate
    # baselines in CI; missing or changed screenshots must fail for review.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install and repair Electron bundle
        run: |
          electron_app="node_modules/electron/dist/Electron.app"
          node node_modules/electron/install.js
          npm rebuild node-pty --build-from-source --runtime=electron --target=43.4.1 --dist-url=https://electronjs.org/headers
          xattr -cr "$electron_app"
          codesign --force --deep --sign - "$electron_app"
          codesign --verify --deep --strict --verbose=2 "$electron_app"
      - name: Build desktop and copy the current renderer
        run: npm run build
      # Each shard has its own machine and Electron bundle. Keep launches
      # serial within a runner to retain the macOS signature stability fix.
      - name: Install Playwright Chromium
        working-directory: apps/praxis-desktop/main
        run: npx playwright install chromium

      - name: Desktop tests
        working-directory: apps/praxis-desktop/main
        run: npx playwright test ${{ matrix.args }} --workers=1 --reporter=list,html
      - name: Upload desktop test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.suite }}
          path: |
            apps/praxis-desktop/main/test-results/
            apps/praxis-desktop/main/playwright-report/
            apps/praxis-desktop/main/output/playwright/
          if-no-files-found: ignore
