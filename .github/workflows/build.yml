name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Typecheck
        run: npm run check-types

      - name: Build renderer
        run: npm run build:renderer

      - name: Copy renderer into the Electron host
        run: npm run desktop:copy-renderer

      - name: Compile desktop
        run: npm run build:desktop

      - name: Core unit tests
        run: npm run test:core

      - name: Desktop Git and persistence tests
        run: npm run test:desktop:git

      - name: Workflow process and write-back tests
        run: npm run test:desktop:workflows

  desktop:
    # Committed Playwright baselines are Darwin snapshots. Do not regenerate
    # baselines in CI; missing or changed screenshots must fail for review.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair Electron bundle signature
        run: |
          electron_app="node_modules/electron/dist/Electron.app"
          xattr -cr "$electron_app"
          codesign --force --deep --sign - "$electron_app"
          codesign --verify --deep --strict --verbose=2 "$electron_app"
      - name: Build desktop and copy the current renderer
        run: npm run build
      - name: Desktop functional tests
        run: npm run test:desktop
      - name: Desktop appearance regressions
        if: ${{ !cancelled() }}
        run: npm run test:desktop:themes
      - name: Upload desktop test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: |
            apps/praxis-desktop/main/test-results/
            apps/praxis-desktop/main/output/playwright/
          if-no-files-found: ignore
