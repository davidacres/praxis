name: Publish Packages to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci

      - name: Build libraries
        run: |
          npm run build:core
          npm run build:mobile-protocol

      - name: Stage release packages in the owning GitHub namespace
        env:
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          package_version="$(node -p "require('./apps/praxis-desktop/main/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          node apps/praxis-desktop/main/scripts/stagePublishedLibraries.cjs "$RUNNER_TEMP/praxis-packages" "$PACKAGE_OWNER" "$package_version"

      - name: Publish core
        run: npm publish "$RUNNER_TEMP/praxis-packages/core"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish mobile protocol
        run: npm publish "$RUNNER_TEMP/praxis-packages/mobile-protocol"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
