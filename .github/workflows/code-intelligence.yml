name: Code intelligence native verification

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run the generated 5k-symbol real-model benchmark on Linux'
        type: boolean
        default: false
      run_qualification:
        description: 'Run actual full-volume and crash-recovery qualification on every host'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'services/code-intelligence/**'
      - 'scripts/build-service.mjs'
      - '.github/workflows/code-intelligence.yml'

permissions:
  contents: read

concurrency:
  group: code-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PRAXIS_DOTNET: dotnet
    steps:
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure runner-local fixture locations
        run: |
          printf 'PRAXIS_MODEL_BUNDLE=%s/praxis-model\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PRAXIS_CONTRACT_SAMPLES=%s/praxis-contract-samples\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Provision hash-pinned local model assets
        run: python services/code-intelligence/scripts/prepare-model.py "$PRAXIS_MODEL_BUNDLE"
      - name: Verify relevance evaluator safeguards
        run: python -m unittest discover -s services/code-intelligence/scripts -p 'test_*.py'
      - name: Install the pinned TypeScript compiler the adapter and package use
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore locked service dependencies
        run: dotnet restore services/code-intelligence/Praxis.CodeIntelligence.slnx --locked-mode --disable-parallel -m:1
      - name: Run compiler, storage, path and native model fixtures
        run: dotnet test services/code-intelligence/Praxis.CodeIntelligence.slnx --no-restore --nologo -m:1 -p:UseSharedCompilation=false --logger trx --results-directory "${{ runner.temp }}/praxis-test-results"
      - name: Validate actual responses against all normative tool schemas
        run: |
          python -m pip install jsonschema==4.25.1
          python services/code-intelligence/scripts/verify-contracts.py "$PRAXIS_CONTRACT_SAMPLES"
      - name: Verify retained benchmark snapshot guards
        run: |
          dotnet build services/code-intelligence/benchmarks/Praxis.CodeIntelligence.Benchmarks -c Release --no-restore --nologo -m:1 -p:UseSharedCompilation=false
          node services/code-intelligence/scripts/smoke-retained-benchmark.mjs
      - name: Verify independent query-matrix runner safeguards
        run: node --test services/code-intelligence/scripts/test-query-matrix.mjs
      - name: Measure generated 5k-symbol real-model fixture
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks && matrix.os == 'ubuntu-latest'
        run: |
          dotnet build services/code-intelligence/benchmarks/Praxis.CodeIntelligence.Benchmarks -c Release --no-restore --nologo -m:1 -p:UseSharedCompilation=false
          dotnet services/code-intelligence/benchmarks/Praxis.CodeIntelligence.Benchmarks/bin/Release/net10.0/Praxis.CodeIntelligence.Benchmarks.dll --symbols 5000 --queries 100 --model "$PRAXIS_MODEL_BUNDLE" --output "$RUNNER_TEMP/praxis-benchmarks/linux-x64-5000-hybrid.praxis.json"
      - name: Package host runtime and smoke-test native CLI, SQLite and ONNX
        run: node scripts/build-service.mjs --package
      - name: Verify actual watcher and semantic refresh smoke
        run: |
          executable="$GITHUB_WORKSPACE/services/code-intelligence/artifacts/package/Praxis.CodeIntelligence"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$executable.exe"; fi
          node services/code-intelligence/scripts/benchmark-watcher.mjs --executable "$executable" --model "$PRAXIS_MODEL_BUNDLE" --reference "$(dirname "$executable")/System.Private.CoreLib.dll" --symbols 100 --edits 5 --output "$RUNNER_TEMP/praxis-benchmarks/watcher-100-smoke.praxis.json"
      - name: Verify evaluator through the packaged owner
        run: |
          executable="$GITHUB_WORKSPACE/services/code-intelligence/artifacts/package/Praxis.CodeIntelligence"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$executable.exe"; fi
          PRAXIS_CODE_INTELLIGENCE_EXE="$executable" python -m unittest discover -s services/code-intelligence/scripts -p 'test_*.py'
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-intelligence-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/praxis-test-results
            ${{ runner.temp }}/praxis-contract-samples
            ${{ runner.temp }}/praxis-benchmarks
            services/code-intelligence/artifacts/package/package-manifest.json

  qualification:
    name: Disk-full and crash-recovery qualification (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_qualification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PRAXIS_DOTNET: dotnet
    steps:
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure runner-local fixture locations
        run: |
          printf 'PRAXIS_MODEL_BUNDLE=%s/praxis-model\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PRAXIS_QUALIFICATION=%s/praxis-qualification\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Provision hash-pinned local model assets
        run: python services/code-intelligence/scripts/prepare-model.py "$PRAXIS_MODEL_BUNDLE"
      - name: Install the pinned TypeScript compiler the adapter and package use
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore locked service dependencies
        run: dotnet restore services/code-intelligence/Praxis.CodeIntelligence.slnx --locked-mode --disable-parallel -m:1
      - name: Package host runtime
        id: package
        run: node scripts/build-service.mjs --package
      - name: Qualify an actual full volume
        run: |
          mkdir -p "$PRAXIS_QUALIFICATION"
          executable="$GITHUB_WORKSPACE/services/code-intelligence/artifacts/package/Praxis.CodeIntelligence"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$executable.exe"; fi
          node services/code-intelligence/scripts/qualify-disk-full.mjs --executable "$executable" --output "$PRAXIS_QUALIFICATION/disk-full-${{ runner.os }}.praxis.json"
      - name: Qualify crash recovery under abrupt owner termination
        if: always() && steps.package.outcome == 'success'
        run: |
          mkdir -p "$PRAXIS_QUALIFICATION"
          executable="$GITHUB_WORKSPACE/services/code-intelligence/artifacts/package/Praxis.CodeIntelligence"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$executable.exe"; fi
          node services/code-intelligence/scripts/qualify-crash-recovery.mjs --executable "$executable" --model "$PRAXIS_MODEL_BUNDLE" --reference "$(dirname "$executable")/System.Private.CoreLib.dll" --symbols 2000 --iterations 20 --output "$PRAXIS_QUALIFICATION/crash-recovery-${{ runner.os }}.praxis.json"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-intelligence-qualification-${{ matrix.os }}
          retention-days: 30
          path: ${{ runner.temp }}/praxis-qualification
