[package]
name = "praxis-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
napi-addon = ["dep:napi", "dep:napi-derive"]

[dependencies]
praxis-ai.workspace = true
praxis-contracts.workspace = true
praxis-core.workspace = true
praxis-mobile.workspace = true
praxis-trackers.workspace = true
praxis-workflows.workspace = true
axum.workspace = true
chrono.workspace = true
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
aes.workspace = true
cbc.workspace = true
pbkdf2.workspace = true
sha1.workspace = true
base64.workspace = true
sha2.workspace = true
url.workspace = true
getrandom.workspace = true
reqwest.workspace = true
async-trait.workspace = true

# OS credential stores. One backend per platform; none is exercised by tests
# (tests use the file backend so a developer's real keychain is never touched).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
