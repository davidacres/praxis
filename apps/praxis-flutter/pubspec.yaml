name: praxis_mobile
description: "Praxis mobile companion — Flutter version"
publish_to: 'none'

version: 0.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.0.0

  # Networking
  http: ^1.1.0

  # Local storage
  flutter_secure_storage: ^9.1.0

  # Native biometric auth
  local_auth: ^2.0.0

  # Camera for pairing QR codes
  camera: ^0.10.0
  qr_flutter: ^4.0.0

  # SVG rendering for motifs
  flutter_svg: ^2.0.0

  # Markdown rendering
  flutter_markdown: ^0.6.0
  url_launcher: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
