  <!--
    Activity-bar icon. Same rules as Frosty's media/activity-icon.svg:

    VS Code renders view-container icons as a CSS mask, so only the alpha
    channel survives — every colour is replaced by the theme foreground.
    A logo with an opaque background plate therefore masks to a solid filled
    square with no glyph visible. This icon has no background and uses a
    single colour via currentColor / filled paths.
  -->
