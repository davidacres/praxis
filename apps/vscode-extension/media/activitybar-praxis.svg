<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     role="img" aria-label="Praxis">
  <!--
    Activity-bar icon: the Praxis "P" mark.

    VS Code renders view-container icons as a CSS mask, so only the alpha
    channel survives — every colour is replaced by the theme foreground. The
    glyph is a single-colour stroke via currentColor with no background plate
    (a plate would mask to a solid filled square with no glyph visible).
  -->
  <path d="M9.5 19 V5.5
           C9.5 5.5 13.2 5.4 14.6 6.4
           C15.9 7.35 15.9 9.15 14.6 10.1
           C13.3 11.05 9.9 11 9.5 10.9"
        fill="none" stroke="currentColor" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="9.5" cy="5.5" r="1.15" fill="currentColor"/>
</svg>
