<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#2c2620"/>
      <stop offset="55%" stop-color="#1e1a15"/>
      <stop offset="100%" stop-color="#100e0b"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="letter" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fbf5e8"/>
      <stop offset="100%" stop-color="#ddd0b6"/>
    </linearGradient>

    <clipPath id="panelClip">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>

    <filter id="letterShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="innerShade" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="-22" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="in" result="innerShadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="innerShadow" operator="in"/>
    </filter>
  </defs>

  <!-- background panel -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- subtle top-edge inner shade for panel depth -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="#000" opacity="0" filter="url(#innerShade)" clip-path="url(#panelClip)"/>

  <!-- glyph, drawn with drop shadow so it lifts off the panel -->
  <g filter="url(#letterShadow)" transform="translate(278 757) scale(1.55)">
    <path d="M43.50 43.50Q31 43.50 20 36.50Q9 29.50 9 18.50Q9 13 11.50 5.25Q14-2.50 16-9Q32-58 46-100.50Q60-143 74-183Q88-223 103.75-263Q119.50-303 139-346.50Q120-343 105.25-336.25Q90.50-329.50 81.50-324.25Q72.50-319 69.50-319Q67.50-319 63.75-321.25Q60-323.50 57-326.75Q54-330 54-332.50Q67-338 84.75-344.50Q102.50-351 123-355.50Q143.50-360 164.50-360Q186.50-360 209.25-354Q232-348 251-335.75Q270-323.50 281.50-305.50Q293-287.50 293-263.50Q293-237.50 281.50-218.75Q270-200 251-187.25Q232-174.50 210-166.75Q188-159 166.25-154.75Q144.50-150.50 127.50-149.25Q110.50-148 102.50-148L97.50-148Q82.50-96.50 68.75-46.50Q55 3.50 43.50 43.50M99.50-156Q127-157.50 155.25-165Q183.50-172.50 207-186.75Q230.50-201 245-222.25Q259.50-243.50 259.50-272Q259.50-299 246.75-316Q234-333 213.25-341.25Q192.50-349.50 169-349.50Q150.50-313 133-262Q115.50-211 99.50-156"
          fill="none"
          stroke="url(#letter)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- glass gloss sweep across the top of the panel -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#gloss)" clip-path="url(#panelClip)"/>
</svg>
