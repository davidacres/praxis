[package]
name = "praxis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Praxis in-process Tauri desktop shell"

# The workspace forbids `unsafe`; this crate alone denies it so `macos_snapshot.rs` can call
# WebKit's snapshot API, which Tauri does not wrap. Nothing else may opt in.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
praxis-contracts.workspace = true
praxis-core.workspace = true
praxis-trackers.workspace = true
praxis-ai.workspace = true
praxis-workflows.workspace = true
praxis-host = { path = "../../../crates/praxis-host" }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
indexmap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
nix = { workspace = true, features = ["net"] }
praxis-mobile.workspace = true
async-trait.workspace = true
reqwest.workspace = true
uuid.workspace = true
url.workspace = true
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

# macOS only: WKWebView page snapshots (thumbnails and browser screenshots). Tauri exposes the
# platform webview handle but no capture API, so the snapshot call is made on it directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString", "NSValue", "NSObject", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tar.workspace = true
flate2.workspace = true
