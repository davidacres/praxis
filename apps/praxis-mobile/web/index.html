<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Praxis Mobile Companion - Flutter Version">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Praxis">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Praxis Mobile</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <meta name="theme-color" content="#007AFF">
</head>
<body>
    <!-- Progressive Web App Loading Indicator -->
    <div id="app-loading" class="loading-indicator">
        <div class="spinner"></div>
        <p>Loading Praxis...</p>
    </div>

    <!-- App Container -->
    <div id="app"></div>

    <!-- This script adds the flutter initialization JS code -->
    <script src="flutter.js" defer></script>
    <script>
        window.addEventListener('load', function(ev) {
            // Disable loading indicator
            const loader = document.getElementById('app-loading');
            if (loader) {
                loader.style.display = 'none';
            }

            // Initialize Flutter web app
            _flutter.loader.loadEntrypoint({
                serviceWorkerSettings: {
                    cacheBustToken: '{{ cache_bust_token }}',
                },
            }).then(function(engineInitializer) {
                return engineInitializer.initializeEngine();
            }).then(function(appRunner) {
                return appRunner.runApp();
            });
        });
    </script>
</body>
</html>
